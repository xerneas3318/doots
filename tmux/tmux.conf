# Remap prefix from 'C-b' to 'C-s'
unbind C-b
set-option -g prefix C-s
bind-key C-s send-prefix

# Re-source configuration with prefix + r
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Session switcher (tmux-sessionx fuzzy popup). Old ~/dotfiles/tmux/tmux-sessionizer.sh
# no longer exists, so prefix+f now opens sessionx (also bound to prefix+o by default).
bind f run-shell "~/.tmux/plugins/tmux-sessionx/scripts/sessionx.sh"

# Enable mouse control
set -g mouse on

# Drag windows in the status bar to reorder them
bind-key -n MouseDrag1Status swap-window -d -t=

# Shorten command delay
set -sg escape-time 1

# Don't rename windows automatically
set -g allow-rename off

# Allow focus events
set -g focus-events on

# Terminal features
set -as terminal-features ',xterm-256color:RGB'
set -as terminal-features ',xterm-kitty:RGB'
set -ga terminal-overrides ',xterm-kitty:Tc'
set -ga terminal-features ',xterm-kitty:sixel'
set -g allow-passthrough on

# --- Quality-of-life ---
# Much larger scrollback buffer
set -g history-limit 50000
# Longer on-screen time for status messages (ms)
set -g display-time 2000
# Highlight the active pane's border (blue theme); dim the inactive ones
set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#89b4fa'
# Notify (no auto-jump) when another window has activity
set -g monitor-activity on
set -g visual-activity off
# Repeatable pane resizing: prefix then H/J/K/L (hold to repeat)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
# Toggle synchronized input across all panes in the window
bind C-x setw synchronize-panes \; display-message "synchronize-panes #{?pane_synchronized,ON,OFF}"

# Split panes with [ and ], keep current path
unbind '"'
unbind %
bind [ split-window -h -c "#{pane_current_path}"
bind ] split-window -v -c "#{pane_current_path}"

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Previous window with prefix p
unbind p
bind p previous-window

# Vim keys to switch panes (with prefix)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# tmux-resurrect / continuum
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-strategy-vim 'session'
# Move manual save off C-s so prefix + C-s (send-prefix) does not trigger a save
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

# vim-tmux-navigator plug related stuff
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n 'C-h' if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n 'C-j' if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n 'C-k' if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n 'C-l' if-shell "$is_vim" "send-keys C-l" "select-pane -R"
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi C-\\ select-pane -l

# System clipboard support
set -s set-clipboard on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Keep window numbers stable when closing (gaps stay; drag-to-swap still works)
set -g renumber-windows off

# Vi-like selection in copy mode
set mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'wl-copy'

# Spotify Player popup
bind C-p run-shell '
if [ "#{session_name}" = "spotify" ]; then
  tmux display-message "Already in spotify session - use prefix d to detach"
else
  tmux has-session -t spotify 2>/dev/null || tmux new-session -d -s spotify spotify_player
  tmux display-popup -E "tmux attach -t spotify"
fi'

# Session jumping with fzf (now handled by tmux-sessionx)
bind C-j run-shell "~/.tmux/plugins/tmux-sessionx/scripts/sessionx.sh"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'laktak/extrakto'

# tmux-sessionx: fuzzy session switcher popup (prefix + o, also prefix+f / C-j above)
set -g @sessionx-bind 'o'
set -g @sessionx-zoxide-mode 'on'
# extrakto: fuzzy-grab paths/URLs/words off the screen (prefix + Tab)
set -g @extrakto_key 'tab'

# Status bar (from old config)
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=#89b4fa'

# Left: leader indicator
set -g status-left '#{?client_prefix,#[fg=green]  ,#[fg=red]  }'
set -g status-left-length 20

# Right: date/time
set -g status-right-style 'fg=black bg=#89b4fa'
set -g status-right '#[bg=terminal fg=#89b4fa]#[bg=#89b4fa fg=black]%Y-%m-%d %H:%M#[bg=terminal fg=#89b4fa]'

# Window list
setw -g window-status-current-style 'fg=black bg=#89b4fa bold'
setw -g window-status-current-format '#[bg=terminal fg=#89b4fa]#[bg=#89b4fa fg=black]#I #W #F#[bg=terminal fg=#89b4fa]'
setw -g window-status-style 'fg=#89b4fa'
setw -g window-status-separator ''
setw -g window-status-format ' #I #[fg=white]#W #[fg=#89b4fa]#F '
setw -g window-status-bell-style 'fg=#89b4fa bg=#89b4fa bold'

# Messages
set -g message-style 'fg=#89b4fa bg=terminal bold'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
