# Remap prefix from 'C-b' to 'C-s'
unbind C-b
set-option -g prefix C-s
bind-key C-s send-prefix

# Re-source config with prefix + r, and wipe stuck mouse-reporting modes. When a
# mouse-enabled remote app (remote tmux/vim/htop) dies with the ssh session, it
# leaves any-event motion tracking (1003 + SGR 1006) enabled on the OUTER
# terminal, which then leaks "35;53;66M"-style garbage on every mouse move. The
# reset MUST go to the real terminal (#{client_tty}), not the pane (#{pane_tty}):
# tmux only owns 1000/1002/1006, so it never clears 1003 on its own. Afterward
# toggle mouse so tmux re-asserts its own modes and normal mouse keeps working.
unbind r
bind r run-shell "printf '\\e[?1000l\\e[?1002l\\e[?1003l\\e[?1005l\\e[?1006l\\e[?1015l\\e[?1016l' > #{client_tty} ; printf '\\e[?1003l\\e[?1005l\\e[?1015l' > #{pane_tty} ; tmux set -g mouse off ; tmux set -g mouse on" \; source-file ~/.tmux.conf \; display-message "Config reloaded + mouse reset"

# tmux-sessionizer keybinding
bind f run-shell "tmux neww ~/dotfiles/tmux/tmux-sessionizer.sh"

# Enable mouse control
set -g mouse on

# Auto-run the same reset every time a client (re)attaches — e.g. after you
# close the laptop and reopen the terminal. Targets #{client_tty} (the real
# terminal left stuck in mouse-tracking mode), then toggles mouse so tmux
# re-asserts 1000/1002/1006 and clicking/scrolling still works.
set-hook -g client-attached 'run-shell "printf \"\\e[?1000l\\e[?1002l\\e[?1003l\\e[?1005l\\e[?1006l\\e[?1015l\\e[?1016l\" > #{client_tty} ; printf \"\\e[?1003l\\e[?1005l\\e[?1015l\" > #{pane_tty} ; tmux set -g mouse off ; tmux set -g mouse on"'

# Drag windows in the status bar to reorder them
bind-key -n MouseDrag1Status swap-window -d -t=

# Shorten command delay
set -sg escape-time 1

# Don't rename windows automatically
set -g allow-rename off

# Allow focus events
set -g focus-events on

# Terminal features
set -as terminal-features ',xterm-256color:RGB'
set -ga terminal-overrides ',xterm-kitty:Tc'
set -ga terminal-features ',xterm-kitty:RGB,sixel,hyperlinks,ccolour,cstyle,focus,mouse,title,clipboard,strikethrough,usstyle,extkeys'
set -g allow-passthrough on

# Split panes with [ and ], keep current path
unbind '"'
unbind %
bind [ split-window -h -c "#{pane_current_path}"
bind ] split-window -v -c "#{pane_current_path}"

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Previous window with prefix p
unbind p
bind p previous-window

# Vim keys to switch panes (with prefix)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# tmux-resurrect / continuum
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-strategy-vim 'session'
# Move manual save off C-s so prefix + C-s (send-prefix) does not trigger a save
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

# vim-tmux-navigator plug related stuff
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n 'C-h' if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n 'C-j' if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n 'C-k' if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n 'C-l' if-shell "$is_vim" "send-keys C-l" "select-pane -R"
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi C-\\ select-pane -l

# System clipboard support
set -s set-clipboard on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Keep window numbers stable when closing (gaps stay; drag-to-swap still works)
set -g renumber-windows off

# Vi-like selection in copy mode
set mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'

# Spotify Player popup
bind C-p run-shell '
if [ "#{session_name}" = "spotify" ]; then
  tmux display-message "Already in spotify session - use prefix d to detach"
else
  tmux has-session -t spotify 2>/dev/null || tmux new-session -d -s spotify spotify_player
  tmux display-popup -E "tmux attach -t spotify"
fi'

# Session jumping with fzf
bind C-j display-popup -E "~/dotfiles/tmux/session-fzf.sh"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Status bar (from old config)
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=#89b4fa'

# Left: leader indicator
set -g status-left '#{?client_prefix,#[fg=green]  ,#[fg=red]  }'
set -g status-left-length 20

# Right: hackfetch stats + date/time. status-interval is how often tmux
# re-runs #(...); 60s keeps Hackatime API traffic light. Lower it for
# faster updates.
set -g status-right-length 120
set -g status-interval 60
set -g status-right-style 'fg=black bg=#89b4fa'
set -g status-right '#[bg=terminal fg=#f38ba8]#[bg=#f38ba8 fg=black] #(hackfetch -status) #[bg=terminal fg=#f38ba8] #[bg=terminal fg=#89b4fa]#[bg=#89b4fa fg=black]%Y-%m-%d %H:%M#[bg=terminal fg=#89b4fa]'

# Window list
setw -g window-status-current-style 'fg=black bg=#89b4fa bold'
setw -g window-status-current-format '#[bg=terminal fg=#89b4fa]#[bg=#89b4fa fg=black]#I #W #F#[bg=terminal fg=#89b4fa]'
setw -g window-status-style 'fg=#89b4fa'
setw -g window-status-separator ''
setw -g window-status-format ' #I #[fg=white]#W #[fg=#89b4fa]#F '
setw -g window-status-bell-style 'fg=#89b4fa bg=#89b4fa bold'

# Messages
set -g message-style 'fg=#89b4fa bg=terminal bold'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
